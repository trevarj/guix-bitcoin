# Monthly upstream-release check.  Runs `guix refresh` over the channel's
# packages (etc/ci-refresh-report.sh), opens one pull request per validated
# mechanical update, and maintains a GitHub issue assigned to the maintainer.
# GitHub emails the assignee via normal notifications, so no SMTP secret is
# needed.
#
# Bot commits stay off master because channel authentication requires an
# authorized maintainer signature.  Integrate each PR with etc/merge-pr.sh so
# the resulting master commit is signed.  Complex bumps still need manual work.
# GitHub-only on purpose -- mirroring to Forgejo would open a second issue and
# double the email.
#
# Trigger manually any time:  gh workflow run refresh.yml
name: refresh
on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --security-opt seccomp=unconfined
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            /gnu
            /var/guix
            /root/.config/guix
            /root/.cache/guix
          key: guix-${{ hashFiles('etc/ci-guix-channels.scm', 'etc/ci-setup-guix.sh') }}
      - name: Generate update report
        run: |
          ./etc/ci-setup-guix.sh ensure
          ./etc/ci-refresh-report.sh | tee refresh-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: refresh-report
          path: refresh-report.md

  prepare-auto-update:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          packages=$(./etc/ci-auto-update.sh --list | jq -R . | jq -sc .)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  auto-update:
    needs: prepare-auto-update
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare-auto-update.outputs.packages) }}
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --security-opt seccomp=unconfined
    timeout-minutes: 350
    steps:
      # Without Git, checkout falls back to a source archive with no repository
      # metadata for the updater's clean-tree and changed-file guards.
      - name: Install Git and GitHub CLI
        run: |
          apt-get update -qq
          apt-get install -y -qq ca-certificates gh git
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            /gnu
            /var/guix
            /root/.config/guix
            /root/.cache/guix
          key: guix-${{ hashFiles('etc/ci-guix-channels.scm', 'etc/ci-setup-guix.sh') }}
      - name: Prepare and validate update
        id: update
        run: |
          ./etc/ci-setup-guix.sh ensure
          # checkout configures Git on the host, while this job runs Git as
          # root inside the container.
          git config --system --add safe.directory "$(pwd -P)"
          git rev-parse --show-toplevel
          ./etc/ci-auto-update.sh "${{ matrix.package }}"
          if ! git diff --quiet; then
            if [ -d /tmp/guix-nonguix ]; then
              guix lint -L . -L /tmp/guix-nonguix --exclude=cve "${{ matrix.package }}"
              guix build -L . -L /tmp/guix-nonguix "${{ matrix.package }}"
            else
              guix lint -L . --exclude=cve "${{ matrix.package }}"
              guix build -L . "${{ matrix.package }}"
            fi
          fi
      - name: Package update patch
        if: steps.update.outputs.changed == 'true'
        run: |
          mkdir auto-update-artifact
          git diff --binary -- "${{ steps.update.outputs.file }}" \
            > "auto-update-artifact/${{ matrix.package }}.patch"
          {
            echo "package=${{ matrix.package }}"
            echo "old_version=${{ steps.update.outputs.old_version }}"
            echo "new_version=${{ steps.update.outputs.new_version }}"
          } > "auto-update-artifact/metadata.env"
      - uses: actions/upload-artifact@v4
        if: steps.update.outputs.changed == 'true'
        with:
          name: package-update-${{ matrix.package }}
          path: auto-update-artifact
          retention-days: 30
      - name: Open or refresh update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PACKAGE: ${{ matrix.package }}
          FILE: ${{ steps.update.outputs.file }}
          OLD_VERSION: ${{ steps.update.outputs.old_version }}
          NEW_VERSION: ${{ steps.update.outputs.new_version }}
        run: |
          branch="auto-update/$PACKAGE"
          title="chore($PACKAGE): update to $NEW_VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$FILE"
          git commit -m "$title" \
            -m "- update $PACKAGE from $OLD_VERSION to $NEW_VERSION" \
            -m "- validate with guix lint and guix build"

          # Stable per-package branches make retries update the existing PR.
          # Respect the last remote value so concurrent/manual branch edits are
          # never overwritten silently.
          if git fetch origin \
              "refs/heads/$branch:refs/remotes/origin/$branch"; then
            expected=$(git rev-parse "refs/remotes/origin/$branch")
            git push --force-with-lease="refs/heads/$branch:$expected" \
              origin "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi

          write_body() {
            pr_number=$1
            {
              echo "Automated mechanical update prepared by [refresh CI]($RUN_URL)."
              echo
              echo "- Package: \`$PACKAGE\`"
              echo "- Version: \`$OLD_VERSION\` -> \`$NEW_VERSION\`"
              echo "- Validation: \`guix lint\` and \`guix build\` passed"
              echo
              echo "The bot commit is not authorized for the authenticated channel."
              echo "Do not use GitHub's merge button. Integrate and sign it locally:"
              echo
              echo "\`\`\`sh"
              echo "etc/merge-pr.sh origin pull/$pr_number/head"
              echo "git push origin master"
              echo "git push codeberg master"
              echo "gh pr close $pr_number --delete-branch"
              echo "\`\`\`"
            } > auto-update-pr.md
          }

          pr_number=$(gh pr list --repo "$REPO" --state open \
            --base "$BASE_BRANCH" --head "$branch" --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            write_body NUMBER
            pr_url=$(gh pr create --repo "$REPO" --base "$BASE_BRANCH" \
              --head "$branch" --title "$title" --body-file auto-update-pr.md)
            pr_number=${pr_url##*/}
          fi
          write_body "$pr_number"
          gh pr edit "$pr_number" --repo "$REPO" \
            --title "$title" --body-file auto-update-pr.md

  notify:
    if: always() && needs.report.result == 'success'
    needs: [report, prepare-auto-update, auto-update]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: refresh-report
          path: .
      - name: Open tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTO_UPDATE_RESULT: ${{ needs.auto-update.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo
            echo "## Automated update pull requests"
            echo
            if [ "$AUTO_UPDATE_RESULT" = success ]; then
              echo "Mechanically safe updates were validated and opened as pull requests; patch artifacts are also attached to the [workflow run]($RUN_URL)."
            else
              echo "Automated patch preparation did not fully succeed; inspect the [workflow run]($RUN_URL)."
            fi
            echo
            echo "Review each automated PR, then use its \`etc/merge-pr.sh\` command to create the authorized signed commit. Complex updates remain manual."
            echo
            echo "### Open automated update PRs"
            echo
            gh pr list --repo "$REPO" --state open --limit 100 \
              --json number,title,url,headRefName \
              --jq '.[] | select(.headRefName | startswith("auto-update/")) | "- [#\(.number) \(.title)](\(.url))"'
          } >> refresh-report.md
          gh label create package-updates --repo "$REPO" \
            --color FBCA04 --description "Monthly upstream update check" --force || true
          title="Package updates — $(date -u +%Y-%m)"
          issue_number=$(gh issue list --repo "$REPO" --state open \
            --label package-updates --limit 100 --json number,title \
            | jq -r --arg title "$title" \
                '.[] | select(.title == $title) | .number' | head -n 1)
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --repo "$REPO" \
              --body-file refresh-report.md \
              --add-assignee trevarj \
              --add-label package-updates
          else
            gh issue create --repo "$REPO" \
              --title "$title" \
              --body-file refresh-report.md \
              --assignee trevarj \
              --label package-updates
          fi
